<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Prism Edge profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93C5FD"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#93C5FD" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="none" stroke-width="6"><circle cx="160" cy="160" r="128" stroke="#93C5FD" stroke-dasharray="3 7"/><circle cx="160" cy="160" r="117" stroke="#2563EB" stroke-dasharray="28 8"/><path d="M160 18 174 42 202 45 181 65 187 93 160 79 133 93 139 65 118 45 146 42Z M42 160 66 146 69 118 89 139 117 133 103 160 117 187 89 181 69 202 66 174Z M278 160 254 174 251 202 231 181 203 187 217 160 203 133 231 139 251 118 254 146Z" stroke="#93C5FD" fill="#2563EB" fill-opacity=".25"/></g></g></svg>

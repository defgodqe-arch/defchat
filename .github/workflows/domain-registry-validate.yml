name: Validate domain registry

on:
  push:
    branches: [main]
    paths:
      - "registry/domains.json"
      - "registry/README.md"
      - ".github/workflows/domain-registry-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-registry-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate registry structure and records
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry = JSON.parse(fs.readFileSync('registry/domains.json', 'utf8'));
          if (registry.schema_version !== 1) throw new Error('Unsupported schema_version');
          if (!Array.isArray(registry.domains)) throw new Error('domains must be an array');
          if (typeof registry.issuance_enabled !== 'boolean') throw new Error('issuance_enabled must be boolean');
          if (registry.parent_domain !== 'de5.net') throw new Error('parent_domain must be de5.net for the DNSHE free suffix setup');
          if (registry.dns_provider !== 'DNSHE') throw new Error('dns_provider must be DNSHE');
          const seen = new Set();
          const labelPattern = /^(?=.{3,32}$)[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/;
          for (const record of registry.domains) {
            if (!record || typeof record !== 'object') throw new Error('Each record must be an object');
            if (typeof record.name !== 'string' || !labelPattern.test(record.name)) throw new Error('Invalid domain label: ' + String(record.name));
            if (seen.has(record.name)) throw new Error('Duplicate label: ' + record.name);
            seen.add(record.name);
            if (record.target !== undefined) {
              let url;
              try { url = new URL(record.target); } catch { throw new Error('Invalid target URL for ' + record.name); }
              if (!['http:', 'https:'].includes(url.protocol)) throw new Error('Only HTTP(S) destinations are allowed in registry metadata');
            }
          }
          console.log('Registry valid:', registry.domains.length, 'records; issuance_enabled=' + registry.issuance_enabled);
          if (registry.issuance_enabled) console.log('WARNING: live registration is enabled; verify DNSHE API secrets exist in repository Actions settings.');
          NODE

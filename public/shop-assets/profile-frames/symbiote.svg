<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Living Shadow profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E5E7EB"/><stop offset="1" stop-color="#111827"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#E5E7EB" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M42 79 Q84 90 79 130 Q75 157 43 171 Q91 184 97 224 M278 79 Q236 90 241 130 Q245 157 277 171 Q229 184 223 224" stroke="#E5E7EB" stroke-width="13"/><path d="M51 85 Q95 109 109 78 M269 85 Q225 109 211 78 M62 232 Q100 210 106 252 M258 232 Q220 210 214 252" stroke="#111827" stroke-width="7"/><circle cx="45" cy="79" r="9" fill="#E5E7EB"/><circle cx="275" cy="79" r="9" fill="#E5E7EB"/></g></g></svg>

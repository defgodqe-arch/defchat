<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Rose Dragon profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FB7185"/><stop offset="1" stop-color="#9D174D"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#FB7185" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="none" stroke="#FB7185" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M53 100 Q14 59 34 31 Q65 42 77 75 Q98 42 122 42 Q119 73 96 96"/><path d="M267 100 Q306 59 286 31 Q255 42 243 75 Q222 42 198 42 Q201 73 224 96"/><path d="M61 214 Q28 235 44 272 Q68 253 79 230 M259 214 Q292 235 276 272 Q252 253 241 230"/></g><g fill="#9D174D"><path d="M160 20 169 42 193 43 174 58 181 81 160 67 139 81 146 58 127 43 151 42Z"/><circle cx="48" cy="160" r="6"/><circle cx="272" cy="160" r="6"/></g></g></svg>

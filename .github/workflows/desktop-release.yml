name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    name: 'Package (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:win
            artifact: '*.exe'
          - os: macos-latest
            script: desktop:mac
            artifact: '*.dmg'
          - os: ubuntu-latest
            script: desktop:linux
            artifact: '*.AppImage'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run ${{ matrix.script }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: defchat-${{ matrix.os }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.artifact }}

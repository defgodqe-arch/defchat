<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Blue Galaxy profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7DD3FC"/><stop offset="1" stop-color="#4338CA"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#7DD3FC" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="none" stroke="#7DD3FC" stroke-linecap="round"><ellipse cx="160" cy="160" rx="131" ry="111" stroke-width="3" stroke-dasharray="2 11"/><ellipse cx="160" cy="160" rx="119" ry="122" stroke-width="2" opacity=".7" transform="rotate(25 160 160)"/><path d="M55 85 Q26 112 42 140 M265 85 Q294 112 278 140" stroke-width="8"/><path d="M83 54 88 68 102 73 88 78 83 92 78 78 64 73 78 68Z M237 219 242 233 256 238 242 243 237 257 232 243 218 238 232 233Z" fill="#7DD3FC" stroke="none"/></g><g fill="#4338CA"><circle cx="62" cy="184" r="4"/><circle cx="250" cy="113" r="5"/><circle cx="119" cy="35" r="3"/><circle cx="198" cy="285" r="4"/></g></g></svg>

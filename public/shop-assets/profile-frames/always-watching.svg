<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Always Watching profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#EF4444"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#A78BFA" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g><path d="M23 160 Q72 91 160 105 Q248 91 297 160 Q248 229 160 215 Q72 229 23 160Z" fill="none" stroke="#A78BFA" stroke-width="8"/><ellipse cx="160" cy="160" rx="32" ry="42" fill="#EF4444" stroke="#A78BFA" stroke-width="5"/><circle cx="160" cy="160" r="11" fill="#A78BFA"/><path d="M53 72 60 91 80 98 60 105 53 124 46 105 26 98 46 91Z M267 196 274 215 294 222 274 229 267 248 260 229 240 222 260 215Z" fill="#A78BFA"/></g></g></svg>

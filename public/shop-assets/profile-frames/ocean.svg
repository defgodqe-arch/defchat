<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Ocean Current profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#0369A1"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#67E8F9" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="none" stroke-linecap="round"><path d="M31 93 Q60 62 89 93 T147 93 M173 227 Q202 196 231 227 T289 227" stroke="#67E8F9" stroke-width="9"/><path d="M21 122 Q50 91 79 122 T137 122 M183 198 Q212 167 241 198 T299 198" stroke="#0369A1" stroke-width="5"/><path d="M49 162 Q72 142 95 162 M225 160 Q248 140 271 160" stroke="#67E8F9" stroke-width="4"/><circle cx="44" cy="191" r="5" fill="#67E8F9"/><circle cx="276" cy="111" r="5" fill="#67E8F9"/></g></g></svg>

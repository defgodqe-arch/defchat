<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Tropical Symphony profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6EE7B7"/><stop offset="1" stop-color="#0F766E"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#6EE7B7" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="#6EE7B7" stroke="#0F766E" stroke-width="3"><path d="M49 83 Q15 35 24 20 Q73 29 88 73 Q55 51 49 83Z"/><path d="M271 83 Q305 35 296 20 Q247 29 232 73 Q265 51 271 83Z"/><path d="M43 224 Q13 252 25 282 Q61 263 73 235Z"/><path d="M277 224 Q307 252 295 282 Q259 263 247 235Z"/></g><circle cx="47" cy="150" r="5" fill="#6EE7B7"/><circle cx="273" cy="150" r="5" fill="#6EE7B7"/></g></svg>

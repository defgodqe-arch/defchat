name: Build defchat for Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build bundled web app
        run: npm run mobile:build
        env:
          CAPACITOR_BUILD: '1'
      - name: Generate Android native project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/defchat-android.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: defchat-android-apk
          path: release/defchat-android.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-\${{ github.run_number }}
          name: defchat Android build \${{ github.run_number }}
          body: |
            Installable Android APK for defchat.
            
            On your Android phone, download \`defchat-android.apk\`, open it, and allow installation from this source if Android asks. This is a debug-signed APK for direct testing, not a Play Store release.
          files: release/defchat-android.apk
          make_latest: true

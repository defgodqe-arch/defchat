<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Sakura Spring profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9A8D4"/><stop offset="1" stop-color="#BE185D"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#F9A8D4" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g transform="translate(50 74) scale(1.4)" fill="#F9A8D4" stroke="#BE185D" stroke-width="2"><ellipse cy="-10" rx="7" ry="12" transform="rotate(0)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(72)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(144)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(216)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(288)"/><circle r="5" fill="#BE185D"/></g><g transform="translate(270 76) scale(1.3)" fill="#F9A8D4" stroke="#BE185D" stroke-width="2"><ellipse cy="-10" rx="7" ry="12" transform="rotate(0)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(72)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(144)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(216)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(288)"/><circle r="5" fill="#BE185D"/></g><g transform="translate(48 247) scale(1.1)" fill="#F9A8D4" stroke="#BE185D" stroke-width="2"><ellipse cy="-10" rx="7" ry="12" transform="rotate(0)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(72)"/><ellipse cy="-10" rx="7" ry="12" transform="rotate(144)"/><el
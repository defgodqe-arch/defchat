<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Neon Chaos profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E879F9"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#E879F9" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="none" stroke-linecap="round"><circle cx="160" cy="160" r="132" stroke="#E879F9" stroke-width="4" stroke-dasharray="12 7"/><circle cx="160" cy="160" r="120" stroke="#7C3AED" stroke-width="3" stroke-dasharray="30 10 3 10"/><path d="M60 57 72 88 103 100 72 112 60 143 48 112 17 100 48 88Z M260 177 272 208 303 220 272 232 260 263 248 232 217 220 248 208Z" fill="#E879F9" stroke="#E879F9" stroke-width="2"/></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Eclipse Totality profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#312E81"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#C4B5FD" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="none"><circle cx="160" cy="160" r="130" stroke="#C4B5FD" stroke-width="3" stroke-dasharray="2 8"/><circle cx="160" cy="160" r="117" stroke="#312E81" stroke-width="13" stroke-dasharray="210 15 45 15"/><circle cx="160" cy="160" r="139" stroke="#C4B5FD" stroke-width="2" opacity=".7"/><path d="M160 18 A142 142 0 0 1 302 160" stroke="#C4B5FD" stroke-width="8"/><path d="M160 302 A142 142 0 0 1 18 160" stroke="#312E81" stroke-width="8"/></g></g></svg>

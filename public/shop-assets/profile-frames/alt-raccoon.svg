<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title>Raccoon Mischief profile frame</title><desc>Transparent circular avatar frame preview for defchat. Designed as decorative art around an avatar, inspired by expressive game profile cosmetics.</desc><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9CA3AF"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs><g filter="url(#glow)"><circle cx="160" cy="160" r="126" fill="none" stroke="url(#ring)" stroke-width="9"/><circle cx="160" cy="160" r="115" fill="none" stroke="#9CA3AF" stroke-opacity=".8" stroke-width="2" stroke-dasharray="4 6"/><g fill="none" stroke="#9CA3AF" stroke-width="5"><circle cx="160" cy="160" r="128"/><circle cx="160" cy="160" r="116" stroke="#F97316" stroke-width="2" stroke-dasharray="4 7"/><path d="M160 22 171 47 198 50 178 68 183 94 160 81 137 94 142 68 122 50 149 47Z" fill="#9CA3AF" stroke="#9CA3AF"/></g></g></svg>
